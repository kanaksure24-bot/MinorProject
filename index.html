<!DOCTYPE html>
<html>
<head>
<title>Heart Disease Prediction</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>Heart Disease Prediction</h1>

<form action="/predict" method="post">

<input type="text" name="age" placeholder="Age" required>
<input type="text" name="sex" placeholder="Sex (1=Male,0=Female)" required>
<input type="text" name="cp" placeholder="Chest Pain Type (0-3)" required>
<input type="text" name="trestbps" placeholder="Resting Blood Pressure" required>
<input type="text" name="chol" placeholder="Cholesterol" required>
<input type="text" name="fbs" placeholder="Fasting Blood Sugar" required>
<input type="text" name="restecg" placeholder="Rest ECG (0-2)" required>
<input type="text" name="thalach" placeholder="Maximum Heart Rate" required>
<input type="text" name="exang" placeholder="Exercise Angina (1=yes,0=no)" required>
<input type="text" name="oldpeak" placeholder="Old Peak" required>
<input type="text" name="slope" placeholder="Slope (0-2)" required>
<input type="text" name="ca" placeholder="Major Vessels (0-3)" required>
<input type="text" name="thal" placeholder="Thal (1-3)" required>

<br><br>

<button type="submit">Predict</button>

</form>

</body>
</html>
